<title>わが家のまわりの音マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --sky:#DDF3FF; --sky2:#FFF7D6; --paper:#FFFFFF; --ink:#2F3A5A; --ink2:#6B7597;
  --sun:#FFD23F; --coral:#FF7E9D; --mint:#67D9A4; --lav:#B9A7FF;
  --shadow:0 6px 0 #C9E4F3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1E2740; --sky2:#2A2447; --paper:#2B3352; --ink:#F4F6FF; --ink2:#B7BEDB;
    --shadow:0 6px 0 #141a2e;
  }
}
:root[data-theme="dark"]{
  --sky:#1E2740; --sky2:#2A2447; --paper:#2B3352; --ink:#F4F6FF; --ink2:#B7BEDB;
  --shadow:0 6px 0 #141a2e;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif;color:var(--ink);
  background:var(--sky);
  background-image:radial-gradient(circle at 8% 12%, var(--sky2) 0 90px, transparent 91px),
                   radial-gradient(circle at 92% 30%, var(--sky2) 0 70px, transparent 71px),
                   radial-gradient(circle at 80% 95%, var(--sky2) 0 110px, transparent 111px),
                   radial-gradient(#ffffff55 1.5px, transparent 1.6px);
  background-size:100% 100%,100% 100%,100% 100%,28px 28px;
  min-height:100vh}
header{text-align:center;padding:2.2rem 1rem 1rem}
.notes{font-size:1.6rem;letter-spacing:.4em;display:block;animation:bob 3s ease-in-out infinite}
h1{font-family:"Hachi Maru Pop","Zen Maru Gothic",sans-serif;font-size:clamp(1.7rem,6vw,3rem);margin:.2rem 0 .4rem;line-height:1.3;text-wrap:balance;
  color:var(--ink);text-shadow:3px 3px 0 var(--sun)}
.lead{margin:0 auto;max-width:34em;font-size:1.05rem;color:var(--ink2);line-height:1.7}
.author{display:inline-block;margin-top:1rem;background:var(--paper);border:3px dashed var(--coral);border-radius:999px;padding:.5rem 1.4rem;font-weight:700;font-size:1.05rem}
.grid{display:grid;gap:1.4rem;padding:1.2rem 1rem 3rem;max-width:1100px;margin:0 auto;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.card{background:var(--paper);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
  transform:rotate(var(--tilt,0deg));transition:transform .2s}
.card:nth-child(3n+1){--tilt:-.6deg}.card:nth-child(3n+2){--tilt:.5deg}.card:nth-child(3n){--tilt:-.3deg}
.card:hover{transform:rotate(0) translateY(-3px)}
.pic{position:relative;aspect-ratio:4/3;background:var(--sky2)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.nopic{position:absolute;inset:0}
.nopic{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;
  background:linear-gradient(135deg,var(--lav),var(--coral));color:#fff}
.nopic span{font-size:4rem}.nopic small{font-weight:700}
.num{position:absolute;top:.7rem;left:.7rem;width:2.3rem;height:2.3rem;border-radius:50%;background:var(--sun);color:#3A2E00;
  font-weight:700;display:grid;place-items:center;font-size:1.05rem;box-shadow:0 3px 0 #D9AE00;font-variant-numeric:tabular-nums}
.body{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem}
h2{margin:0;font-size:1.25rem;line-height:1.35;display:flex;gap:.45rem;align-items:center}
.ico{font-size:1.4rem}
.play{--c:var(--mint);--cd:#3FB57F;position:relative;display:flex;align-items:center;gap:.7rem;width:100%;
  border:0;border-radius:999px;padding:.7rem .9rem;background:var(--c);color:#0B3D2A;font:inherit;font-weight:700;font-size:1.05rem;
  cursor:pointer;box-shadow:0 5px 0 var(--cd);transition:transform .1s,box-shadow .1s}
.play:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.play:focus-visible{outline:4px solid var(--lav);outline-offset:3px}
.btn-ico{width:2.3rem;height:2.3rem;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.btn-ico svg{width:1.3rem;height:1.3rem;fill:#0B3D2A}
.i-stop{display:none}
.wave{margin-left:auto;display:flex;gap:3px;align-items:flex-end;height:1.3rem;opacity:.35}
.wave i{width:4px;height:30%;background:#0B3D2A;border-radius:2px}
.card.playing .play{--c:var(--coral);--cd:#D64F72;color:#4A1020}
.card.playing .btn-ico svg{fill:#4A1020}
.card.playing .i-play{display:none}.card.playing .i-stop{display:block}
.card.playing .wave,.qplay.playing .wave{opacity:1}
.card.playing .wave i{animation:wave .7s ease-in-out infinite alternate;background:#4A1020}
.qplay.playing .wave i{animation:wave .7s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
.card.playing .btn-txt::after{content:"…"}
/* quiz */
.quiz-wrap{max-width:640px;margin:0 auto;padding:0 1rem 2.5rem}
.quiz{background:var(--paper);border-radius:26px;box-shadow:var(--shadow);padding:1.6rem 1.4rem;text-align:center;border:3px solid var(--sun)}
.quiz h2{justify-content:center;font-family:"Hachi Maru Pop","Zen Maru Gothic",sans-serif;font-size:1.5rem}
.quiz p{color:var(--ink2);line-height:1.7;margin:.6rem 0 1rem}
.qbtn{border:0;border-radius:999px;font:inherit;font-weight:700;font-size:1.05rem;padding:.8rem 1.6rem;cursor:pointer;
  background:var(--sun);color:#3A2E00;box-shadow:0 5px 0 #D9AE00;transition:transform .1s,box-shadow .1s}
.qbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #D9AE00}
.qbtn:focus-visible{outline:4px solid var(--lav);outline-offset:3px}
.qcount{font-weight:700;color:var(--ink2);letter-spacing:.1em}
.qplay{margin:1rem auto;display:flex;max-width:280px}
.choices{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem}
.choice{border:3px solid var(--sky);border-radius:18px;background:var(--paper);color:var(--ink);font:inherit;font-weight:700;font-size:1.05rem;
  padding:.8rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;justify-content:center;transition:transform .1s}
.choice:hover{transform:scale(1.02);border-color:var(--lav)}
.choice:focus-visible{outline:4px solid var(--lav);outline-offset:2px}
.choice.right{border-color:var(--mint);background:var(--mint);color:#0B3D2A}
.choice.wrong{border-color:var(--coral);background:var(--coral);color:#4A1020}
.choice:disabled{cursor:default}
.qmark{font-family:"Hachi Maru Pop","Zen Maru Gothic",sans-serif;font-size:1.6rem;min-height:2.2rem;margin-top:.8rem}
.qhide{display:none}
footer{text-align:center;padding:1rem 1rem 3rem;color:var(--ink2);font-size:.95rem}
@keyframes wave{from{height:20%}to{height:100%}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.notes,.wave i{animation:none!important}.card{transition:none}}
</style>

<header>
  <span class="notes">♪♫♪</span>
  <h1>わが家のまわりの<br>「音」マップ</h1>
  <p class="lead">家のまわりで きこえる音を あつめました。<br>しゃしんを見て、ボタンをおすと 音がきけるよ！</p>
  <div class="author">御田小学校 五年二組　鈴木 百花菜</div>
</header>
